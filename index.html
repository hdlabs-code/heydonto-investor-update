const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(P.s), iterations: P.n, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(P.i)}, key, b64(P.c));
  return new TextDecoder().decode(pt);
}
let cur = 0, slides = [];
function fit() {
  const st = document.getElementById('stage'), d = document.getElementById('deck');
  const k = Math.min(st.clientWidth / 1920, st.clientHeight / 1080);
  d.style.transform = 'scale(' + k + ') translate(-50%, -50%)';
}
function show(i) {
  cur = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((s, j) => s.classList.toggle('on', j === cur));
  document.getElementById('count').textContent = (cur + 1) + ' / ' + slides.length;
  try { history.replaceState(null, '', '#' + (cur + 1)); } catch (e) {}
}
function open(html) {
  document.getElementById('deck').innerHTML = html;
  slides = Array.from(document.querySelectorAll('.slide'));
  document.getElementById('gate').style.display = 'none';
  document.getElementById('viewer').style.display = 'block';
  fit();
  const h = parseInt((location.hash || '').slice(1), 10);
  show(isNaN(h) ? 0 : h - 1);
}
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value, go = document.getElementById('go'), err = document.getElementById('err');
  if (!pw) return;
  go.disabled = true; err.textContent = 'Opening...';
  try {
    const html = await unlock(pw);
    try { sessionStorage.setItem('hd-pass', pw); } catch (x) {}
    err.textContent = '';
    open(html);
  } catch (x) {
    err.textContent = 'That passcode did not work.';
  } finally { go.disabled = false; }
});
(async () => {
  let pw = null;
  try { pw = sessionStorage.getItem('hd-pass'); } catch (x) {}
  if (pw) { try { open(await unlock(pw)); } catch (x) {} }
})();
window.addEventListener('resize', fit);
document.getElementById('prev').onclick = () => show(cur - 1);
document.getElementById('next').onclick = () => show(cur + 1);
document.getElementById('fs').onclick = () => { const el = document.documentElement; if (!document.fullscreenElement) { el.requestFullscreen && el.requestFullscreen(); } else { document.exitFullscreen && document.exitFullscreen(); } };
document.addEventListener('keydown', e => {
  if (!slides.length) return;
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); show(cur + 1); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); show(cur - 1); }
  else if (e.key === 'Home') show(0);
  else if (e.key === 'End') show(slides.length - 1);
});
window.addEventListener('hashchange', () => {
  if (!slides.length) return;
  const h = parseInt((location.hash || '').slice(1), 10);
  if (!isNaN(h) && h - 1 !== cur) show(h - 1);
});
let tx = null;
document.getElementById('stage').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, {passive: true});
document.getElementById('stage').addEventListener('touchend', e => {
  if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 40) show(cur + (dx < 0 ? 1 : -1));
});
document.getElementById('stage').addEventListener('click', e => {
  if (e.target.closest('a')) return;
  const r = e.currentTarget.getBoundingClientRect();
  show(cur + (e.clientX - r.left > r.width / 2 ? 1 : -1));
});
</script>
